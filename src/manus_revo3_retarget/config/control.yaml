---
manus_revo3_retarget:
  ros__parameters:
    hand_mode: both
    use_revo3_namespace: true
    command_topic_suffix: joint_forward_mit_controller/commands
    retarget_target_topic_suffix: joint_forward_mit_controller/retarget_targets
    mit_command_publish_hz: 200.0
    mit_velocity_feedforward_enabled: false
    mit_velocity_feedforward_scale: 0.0
    # Reach a new glove target in ~2 MIT ticks instead of the last glove gap.
    mit_interpolation_horizon_s: 0.008
    # 1.0 = raw target; lower = smoother, more lag.
    command_ema_alpha: 0.55
    command_max_delta_deg: 12.0
    # Task overlays (config/profiles/{blocks,unbox}.yaml) override hold / pinch / kp.
    # Default launch task:=blocks matches these values. Use task:=unbox for full-hand grasp.
    # Pinch hold only damps index/thumb flexion contact tremor: 1 deg deadband
    # plus slower EMA. Same filter both ways; no release state machine.
    # Gate uses filtered commands after index flexion is clamped to >=0 deg.
    # Enter 28/16, exit 16/8 after 150 ms. Unbox sets pinch_soften_enabled false.
    pinch_soften_enabled: true
    pinch_index_mcp_enter_deg: 28.0
    pinch_index_mcp_exit_deg: 16.0
    pinch_thumb_mcp_enter_deg: 16.0
    pinch_thumb_mcp_exit_deg: 8.0
    pinch_gate_exit_hold_s: 0.15
    pinch_command_ema_alpha: 0.10
    pinch_command_deadband_deg: 1.0
    enable_keyboard_actions: false
    # Hold unused fingers in a fist after startup; they do not follow the glove.
    hold_unused_fingers: true
    hold_left_fingers: [little, ring, middle]
    hold_right_fingers: [little, ring, middle]
    # URDF flexion upper limit is 1.4835 rad ≈ 85°. Hold 2° below that.
    hold_finger_MCP_deg: 83.0
    hold_finger_PIP_deg: 83.0
    hold_finger_DIP_deg: 83.0
    hold_finger_MPR_deg: 0.0
    # Grip strength: higher kp = stronger tracking / firmer grasp.
    mit_default_kp: 1.6
    mit_default_kd: 0.4

    # Per-joint MIT gains. Set to -1 to use mit_default_kp / mit_default_kd.
    mit_left_little_MPR_joint_kp: 1.4
    mit_left_little_MPR_joint_kd: 0.35
    mit_left_little_MCP_joint_kp: -1.0
    mit_left_little_MCP_joint_kd: -1.0
    mit_left_little_PIP_joint_kp: -1.0
    mit_left_little_PIP_joint_kd: -1.0
    mit_left_little_DIP_joint_kp: -1.0
    mit_left_little_DIP_joint_kd: -1.0
    mit_left_ring_MPR_joint_kp: 1.4
    mit_left_ring_MPR_joint_kd: 0.35
    mit_left_ring_MCP_joint_kp: -1.0
    mit_left_ring_MCP_joint_kd: -1.0
    mit_left_ring_PIP_joint_kp: -1.0
    mit_left_ring_PIP_joint_kd: -1.0
    mit_left_ring_DIP_joint_kp: -1.0
    mit_left_ring_DIP_joint_kd: -1.0
    mit_left_middle_MPR_joint_kp: 1.4
    mit_left_middle_MPR_joint_kd: 0.35
    mit_left_middle_MCP_joint_kp: -1.0
    mit_left_middle_MCP_joint_kd: -1.0
    mit_left_middle_PIP_joint_kp: -1.0
    mit_left_middle_PIP_joint_kd: -1.0
    mit_left_middle_DIP_joint_kp: -1.0
    mit_left_middle_DIP_joint_kd: -1.0
    mit_left_index_MPR_joint_kp: 1.4
    mit_left_index_MPR_joint_kd: 0.35
    mit_left_index_MCP_joint_kp: -1.0
    mit_left_index_MCP_joint_kd: -1.0
    mit_left_index_PIP_joint_kp: -1.0
    mit_left_index_PIP_joint_kd: -1.0
    mit_left_index_DIP_joint_kp: -1.0
    mit_left_index_DIP_joint_kd: -1.0
    mit_left_thumb_MCP_joint_kp: -1.0
    mit_left_thumb_MCP_joint_kd: -1.0
    mit_left_thumb_PIP_joint_kp: -1.0
    mit_left_thumb_PIP_joint_kd: -1.0
    mit_left_thumb_DIP_joint_kp: -1.0
    mit_left_thumb_DIP_joint_kd: -1.0
    mit_left_thumb_CMP_joint_kp: -1.0
    mit_left_thumb_CMP_joint_kd: -1.0
    mit_left_thumb_CMR_joint_kp: -1.0
    mit_left_thumb_CMR_joint_kd: -1.0

    mit_right_little_MPR_joint_kp: 1.4
    mit_right_little_MPR_joint_kd: 0.35
    mit_right_little_MCP_joint_kp: -1.0
    mit_right_little_MCP_joint_kd: -1.0
    mit_right_little_PIP_joint_kp: -1.0
    mit_right_little_PIP_joint_kd: -1.0
    mit_right_little_DIP_joint_kp: -1.0
    mit_right_little_DIP_joint_kd: -1.0
    mit_right_ring_MPR_joint_kp: 1.4
    mit_right_ring_MPR_joint_kd: 0.35
    mit_right_ring_MCP_joint_kp: -1.0
    mit_right_ring_MCP_joint_kd: -1.0
    mit_right_ring_PIP_joint_kp: -1.0
    mit_right_ring_PIP_joint_kd: -1.0
    mit_right_ring_DIP_joint_kp: -1.0
    mit_right_ring_DIP_joint_kd: -1.0
    mit_right_middle_MPR_joint_kp: 1.4
    mit_right_middle_MPR_joint_kd: 0.35
    mit_right_middle_MCP_joint_kp: -1.0
    mit_right_middle_MCP_joint_kd: -1.0
    mit_right_middle_PIP_joint_kp: -1.0
    mit_right_middle_PIP_joint_kd: -1.0
    mit_right_middle_DIP_joint_kp: -1.0
    mit_right_middle_DIP_joint_kd: -1.0
    mit_right_index_MPR_joint_kp: 1.4
    mit_right_index_MPR_joint_kd: 0.35
    mit_right_index_MCP_joint_kp: -1.0
    mit_right_index_MCP_joint_kd: -1.0
    mit_right_index_PIP_joint_kp: -1.0
    mit_right_index_PIP_joint_kd: -1.0
    mit_right_index_DIP_joint_kp: -1.0
    mit_right_index_DIP_joint_kd: -1.0
    mit_right_thumb_MCP_joint_kp: -1.0
    mit_right_thumb_MCP_joint_kd: -1.0
    mit_right_thumb_PIP_joint_kp: -1.0
    mit_right_thumb_PIP_joint_kd: -1.0
    mit_right_thumb_DIP_joint_kp: -1.0
    mit_right_thumb_DIP_joint_kd: -1.0
    mit_right_thumb_CMP_joint_kp: -1.0
    mit_right_thumb_CMP_joint_kd: -1.0
    mit_right_thumb_CMR_joint_kp: -1.0
